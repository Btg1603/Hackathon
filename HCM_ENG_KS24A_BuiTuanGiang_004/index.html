<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="system">



            <form id="form-edit" onsubmit="addJob(event)">
                <h1>Hệ Thống Quản Lý Công Việc</h1>
                <div class="h3">
                    <h3>Thêm / Cập Nhật Công Việc</h3>
                </div>


                <div class="row1">
                    <div class="div">
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Tên Công Việc</label>
                            <input name="name" type="text" class="form-control" id="exampleInputEmail1"
                                aria-describedby="emailHelp">
                        </div>

                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Hạn Chót</label>
                            <input name="deadline" type="date" class="form-control" id="exampleInputPassword1">
                        </div>
                    </div>



                    <div class="row2">
                        <div class="div">
                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Người Phụ Trách</label>
                                <input name="leader" type="text" class="form-control" id="exampleInputEmail1"
                                    aria-describedby="emailHelp">
                            </div>

                            <div class="mb-3">
                                <label for="select" class="form-label">Trạng Thái</label>
                                <select name="status" id="select" class="form-select">
                                    <option selected>--Chọn Trạng Thái--</option>
                                    <option value="1">Dang Tiến Hành</option>
                                    <option value="2">Chưa Hoàn Thành</option>
                                    <option value="3">Đã Hoàn Thành</option>
                                </select>
                            </div>

                        </div>
                    </div>
                    </div>
                </div>
                <div>
                    <button id="btn_add_save" type="submit" class="btn btn-primary">Thêm Công Việc</button>
                </div>
            </form>





            <div class="mb-3 mt-3">
                <input placeholder="Tìm Kiếm Theo Tên Công Việc..." type="text" id="search"
                    class="form-control w-50 d-inline-block" />
                <button type="button" class="btn btn-secondary" onclick="searchJob()">Tìm</button>
            </div>







            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">Công Việc</th>
                        <th scope="col">Hạn Chót</th>
                        <th scope="col">Phụ Trách</th>
                        <th scope="col">Trạng Thái</th>
                        <th scope="col">Hành Động</th>
                    </tr>
                </thead>


                <tbody>
                    <tr>
                        <td>Mark</td>
                        <td>Mark</td>
                        <td>Otto</td>
                        <td>@mdo</td>
                        <td>@mdo</td>
                    </tr>
                </tbody>
            </table>



        </div>

    </div>
















    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>
    <script src="./main.js"></script>
</body>

</html>
